#         uses: softprops/action-gh-release@v2
#         with:
#           tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
#           name: mjdev-desktop v${{ steps.ver.outputs.version }}
#           files: dist/**
#           fail_on_unmatched_files: false
#         env:
#           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PSippr publisher on our server: the files of every successful target go to its outbox, it fills
  # https://de.psippr.org/downloads/<version>/, build.json, the apt repo and so the market, and answers ok / failed.
  publish:
    name: Publish (de.psippr.org, apt)
    needs:
      - version
      - package-linux-iso
      - package
    if: always() && needs.version.result == 'success'
    runs-on: self-hosted
    env:
      OUTBOX: /var/lib/psippr-release/desktop-outbox
      VERSION: ${{ needs.version.outputs.version }}
      # how long to wait for the publisher's answer (seconds)
      RESULT_WAIT_S: '900'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Hand over to the publisher
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          rm -f "$OUTBOX/result"
          mkdir -p "$OUTBOX/$VERSION"
          count=0
          for f in dist/*-"$VERSION".deb dist/*-"$VERSION".rpm dist/*-"$VERSION".AppImage dist/*-"$VERSION".apk dist/*-"$VERSION".iso; do
            [ -f "$f" ] || continue
            cp -f "$f" "$OUTBOX/$VERSION/"
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "::error::nothing built for $VERSION"; exit 1; }
          printf '%s\n' "$VERSION" > "$OUTBOX/ready.tmp" && mv -f "$OUTBOX/ready.tmp" "$OUTBOX/ready"
          for _ in $(seq 1 $((RESULT_WAIT_S / 5))); do [ -f "$OUTBOX/result" ] && break; sleep 5; done
          outcome="$(cat "$OUTBOX/result" 2> /dev/null || echo 'no answer from the publisher')"
          echo "publish $VERSION: $outcome"
          [ "$outcome" = ok ]
