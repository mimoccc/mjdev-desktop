name: Release

# Produces versioned distributables for ALL targets a host can build, into a GitHub Release.
# Each target verifies its own required artifacts. Publishing uses every successful target, so
# apk/exe are not held hostage by Linux-only packaging dependencies.
#   linux (deb/rpm/AppImage) + iso                  -> debian:trixie
#   android (apk)                                   -> ubuntu-latest
#   windows (exe)                                   -> windows-latest
#   macos   (dmg)                                   -> macos-latest
# NOTE: iOS cannot be produced — the project has no iOS Kotlin target (commonMain uses
#       JVM-only libs); there is no iOS step.
#
# 8 Oct 2026 (owner: build.psippr.org reads this YAML on a push to git.psippr.org and runs it, no hardcoded build on
# the server): restored from 73778684^. Linux and android jobs run on our runner (act), windows/macos go to Codemagic.
# Every push to main releases a new version (job `version`); job `publish` hands the files to the PSippr publisher
# (de.psippr.org downloads, apt repo, market). The GitHub Release job is kept below as a comment.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Build jobs only read the repo (least privilege — "read only gh" in the build step);
# only the publish job below requests write to create the release.
permissions:
  contents: read

env:
  # live list of published versions (written by the PSippr publisher)
  PUBLISHED_URL: https://de.psippr.org/downloads/build.json

jobs:
  # Version of this release: the repository's app-pkg-version when it is newer than the published one, else the published
  # one with its last number + 1 (1.0.4 -> 1.0.5). Never a fourth part (Android versionCode, buildSrc/VersionCode.kt).
  # An unreadable build.json fails the run, so an older version is never published over a newer one.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Next version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          repo="$(grep -E '^app-pkg-version' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')"
          published="$(curl -fsS -m 20 "$PUBLISHED_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["version"])')"
          if [ "$repo" != "$published" ] && [ "$(printf '%s\n%s\n' "$repo" "$published" | sort -V | tail -1)" = "$repo" ]; then
            next="$repo"
          else
            last="${published##*.}"
            [[ "$last" =~ ^[0-9]+$ ]] || { echo "::error::cannot raise published version $published"; exit 1; }
            next="${published%.*}.$((last + 1))"
          fi
          echo "repository $repo, published $published -> releasing $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  package-linux-iso:
    name: Package (linux-iso)
    needs: version
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install Debian build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates coreutils curl findutils git \
            tar unzip xz-utils zip zstd \
            build-essential pkg-config rpm fakeroot \
            debootstrap squashfs-tools xorriso mtools dpkg-dev \
            grub-common grub-pc-bin grub-efi-amd64-bin debian-archive-keyring \
            wayland-protocols libwayland-dev libwayland-bin \
            libxkbcommon-dev libcairo2-dev libcairo2 libpixman-1-dev libdrm-dev \
            libseat-dev libgbm-dev libegl-dev libgles-dev \
            libcap-dev liblcms2-dev libsystemd-dev libudev-dev libvulkan-dev \
            libxcb1-dev libxcb-composite0-dev libxcb-dri3-dev \
            libxcb-image0-dev libxcb-present-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-res0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-ewmh-dev libxcb-icccm4-dev libxcb-xinput-dev libxcb-errors-dev \
            libx11-xcb-dev libwlroots-0.18-dev

          wayland-scanner --version
          pkg-config --modversion wlroots-0.18

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-debian-trixie-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'compositor/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-debian-trixie-konan-

      - name: Cache AppImage tool
        uses: actions/cache@v4
        with:
          path: .gradle/tools
          key: ${{ runner.os }}-debian-trixie-appimagetool-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-debian-trixie-appimagetool-

      - name: Make gradlew executable
        shell: bash
        run: chmod +x gradlew || true

      # only in this checkout; the repository keeps its own app-pkg-version
      - name: Apply release version
        shell: bash
        run: sed -i 's/^app-pkg-version = .*/app-pkg-version = "${{ needs.version.outputs.version }}"/' gradle/libs.versions.toml

      - name: Read app name + version
        id: meta
        shell: bash
        run: |
          echo "version=$(grep -E '^app-pkg-version' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
          echo "appname=$(grep -E '^app-name' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      # One Gradle invocation keeps dependency resolution/configuration cache hot and avoids
      # re-entering packageFullDeb before makeIso. --continue keeps independent artifacts building
      # when one Linux format fails; artifact collection below publishes whatever succeeded.
      - name: Build linux artifacts
        shell: bash
        continue-on-error: true
        run: ./gradlew packageAppImageFile :desktopApp:packageReleaseRpm packageFullDeb makeIso -PdepCheck=false --stacktrace --continue

      # Primary source is releases/ (collectReleases + makeIso). Fall back to jpackage output
      # dirs for partial builds.
      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VER='${{ steps.meta.outputs.version }}'
          APP='${{ steps.meta.outputs.appname }}'
          BASE="$APP-$VER"
          PKG=packages/main-release
          mkdir -p upload

          copy_pkg() {
            local dir="$1" ext="$2"
            for f in "$dir"/*."$ext"; do
              if [ -e "$f" ]; then
                cp -v "$f" "upload/$BASE.$ext"
                return 0
              fi
            done
            return 0
          }

          if compgen -G "releases/*" > /dev/null; then
            cp -av releases/* upload/
          fi

          [ -f "upload/$BASE.deb" ] || copy_pkg "$PKG/deb" deb
          [ -f "upload/$BASE.rpm" ] || copy_pkg "$PKG/rpm" rpm
          [ -f "upload/$BASE.AppImage" ] || copy_pkg "$PKG/appimage" AppImage
          if [ ! -f "upload/$BASE.iso" ]; then
            for f in releases/*.iso; do
              [ -e "$f" ] && cp -v "$f" "upload/$BASE.iso" && break
            done
          fi

          if [ -d reports ] && [ -n "$(ls -A reports 2>/dev/null)" ]; then
            (cd reports && zip -r "../upload/$BASE-reports.zip" .)
          fi
          echo "=== produced for linux-iso ==="
          ls -la upload/

          require_artifact() {
            local file="upload/$1"
            if [ ! -s "$file" ]; then
              echo "::error::required release artifact is missing or empty: $1"
              exit 1
            fi
          }

          for required in "$BASE.deb" "$BASE.rpm" "$BASE.AppImage" "$BASE.iso"; do
            if [ ! -s "upload/$required" ]; then
              echo "::warning::linux artifact was not produced: $required"
            fi
          done
          require_artifact "$BASE.iso"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-iso
          path: upload/
          if-no-files-found: warn

  package:
    name: Package (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        shell: bash
        run: chmod +x gradlew || true

      # only in this checkout; the repository keeps its own app-pkg-version
      - name: Apply release version
        shell: bash
        run: sed -i 's/^app-pkg-version = .*/app-pkg-version = "${{ needs.version.outputs.version }}"/' gradle/libs.versions.toml

      - name: Read app name + version
        id: meta
        shell: bash
        run: |
          echo "version=$(grep -E '^app-pkg-version' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
          echo "appname=$(grep -E '^app-name' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      # Decode the Android release keystore from a base64 secret (optional). Without the
      # secret the APK is debug-signed by the build fallback — still installable.
      - name: Decode Android keystore
        if: matrix.target == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Android release keystore decoded"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret — APK will be debug-signed"
          fi

      # ---------- android (.apk) ----------
      - name: Build android .apk
        if: matrix.target == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -PdepCheck=false --stacktrace

      # ---------- windows (.exe) ----------
      - name: Build windows .exe
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./gradlew :desktopApp:packageReleaseExe -PdepCheck=false --stacktrace

      # ---------- macos (.dmg) ----------
      # Signing/notarization activate only when the Apple Developer ID secrets are present
      # (see desktopApp.gradle.kts macOS block); otherwise the .dmg is built unsigned.
      - name: Build macOS .dmg
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_BUNDLE_ID: ${{ secrets.MACOS_BUNDLE_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./gradlew :desktopApp:packageReleaseDmg -PdepCheck=false --stacktrace

      # ---------- collect whatever got produced (versioned names) ----------
      # Primary source is releases/ (collectReleases + makeIso). Fall back to jpackage output
      # dirs for partial builds and for platform-specific runners (exe/dmg).
      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VER='${{ steps.meta.outputs.version }}'
          APP='${{ steps.meta.outputs.appname }}'
          BASE="$APP-$VER"
          PKG=packages/main-release
          mkdir -p upload

          copy_pkg() {
            local dir="$1" ext="$2"
            for f in "$dir"/*."$ext"; do
              if [ -e "$f" ]; then
                cp -v "$f" "upload/$BASE.$ext"
                return 0
              fi
            done
            return 0
          }

          if compgen -G "releases/*" > /dev/null; then
            cp -av releases/* upload/
          fi

          copy_pkg "$PKG/exe" exe
          copy_pkg "$PKG/dmg" dmg
          if [ ! -f "upload/$BASE.apk" ]; then
            for f in androidApp/build/outputs/apk/release/*.apk; do
              [ -e "$f" ] && cp -v "$f" "upload/$BASE.apk" && break
            done
          fi

          if [ -d reports ] && [ -n "$(ls -A reports 2>/dev/null)" ]; then
            (cd reports && zip -r "../upload/$BASE-reports.zip" .)
          fi
          echo "=== produced for ${{ matrix.target }} ==="
          ls -la upload/

          require_artifact() {
            local file="upload/$1"
            if [ ! -s "$file" ]; then
              echo "::error::required release artifact is missing or empty: $1"
              exit 1
            fi
          }

          case '${{ matrix.target }}' in
            android)
              require_artifact "$BASE.apk"
              ;;
            windows)
              require_artifact "$BASE.exe"
              ;;
            macos)
              require_artifact "$BASE.dmg"
              ;;
          esac

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: upload/
          if-no-files-found: warn

  # until 8 Oct 2026 the release went to GitHub (the repository is no longer there):
